# Render Blueprint: one free web service running the synthetic Tideway demo.
# Render sets PORT and RENDER_EXTERNAL_HOSTNAME; Tideway accepts requests for that public hostname only.
# The SQLite file lives on the instance's temporary disk, so the demo data resets on each deploy or restart.
# Optional cloud AI: add OPENROUTER_API_KEY and/or GEMINI_API_KEY as secret environment variables in the
# Render dashboard (never in this file). Without them the local agent answers every question.
services:
  - type: web
    name: tideway-mu-2026
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: python -m compileall -q run.py tideway
    startCommand: python run.py --host 0.0.0.0 --port $PORT --db /tmp/tideway.sqlite3
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TIDEWAY_DECISION_LAB
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TIDEWAY_SPEECH_GROQ_API_KEY
        sync: false
